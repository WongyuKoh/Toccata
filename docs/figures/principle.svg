<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="벨로시티는 두 지점 사이 시간, 페달은 스위치 하나">
<title>Toccata — 세기와 페달을 얻는 원리</title>
<style>
 text{font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;fill:#17181A}
 .t{font-size:13px} .s{font-size:11.5px;fill:#6B6459} .b{font-size:15px;font-weight:600}
 .m{font-family:"IBM Plex Mono",monospace;font-size:12px}
 .key{fill:#FDFCF9;stroke:#2B2B2B;stroke-width:1.6}
 .bed{fill:#D8D2C6;stroke:#8A8377;stroke-width:1}
 .ir{fill:#1F5FD8} .beam{stroke:#B3261E;stroke-width:1.6;stroke-dasharray:5 3}
 .hit{fill:#B3261E} .ok{fill:#2E7D4F}
 @media (prefers-color-scheme: dark){
   text{fill:#E8E6E1} .s{fill:#A8A093} .key{fill:#EDEAE3;stroke:#111} .bed{fill:#3A3730;stroke:#6E675B}
 }
</style>
<rect width="980" height="520" fill="none"/>

<text class="b" x="40" y="36">세기 — 두 지점을 지나는 데 걸린 시간이 전부다</text>

<!-- 3 프레임 -->
<g>
 <!-- frame 1 -->
 <g transform="translate(40,60)">
  <rect class="key" x="0" y="20" width="230" height="20" rx="3"/>
  <rect class="bed" x="0" y="118" width="230" height="10"/>
  <line class="beam" x1="150" y1="30" x2="150" y2="30"/>
  <circle class="ir" cx="150" cy="70" r="5"/><circle class="ir" cx="150" cy="104" r="5"/>
  <text class="s" x="164" y="74">A 지점</text><text class="s" x="164" y="108">B 지점</text>
  <text class="t" x="0" y="150">① 안 누른 상태</text>
  <text class="s" x="0" y="168">타이머 정지</text>
 </g>
 <!-- frame 2 -->
 <g transform="translate(330,60)">
  <rect class="key" x="0" y="54" width="230" height="20" rx="3"/>
  <rect class="bed" x="0" y="118" width="230" height="10"/>
  <circle class="hit" cx="150" cy="70" r="6"/><circle class="ir" cx="150" cy="104" r="5"/>
  <text class="s" x="164" y="74">A 통과</text>
  <text class="t" x="0" y="150">② A를 지난 순간</text>
  <text class="m" x="0" y="168" fill="#B3261E">t1 기록 — 타이머 시작</text>
 </g>
 <!-- frame 3 -->
 <g transform="translate(620,60)">
  <rect class="key" x="0" y="88" width="230" height="20" rx="3"/>
  <rect class="bed" x="0" y="118" width="230" height="10"/>
  <circle class="ir" cx="150" cy="70" r="5"/><circle class="hit" cx="150" cy="104" r="6"/>
  <text class="s" x="164" y="108">B 통과</text>
  <text class="t" x="0" y="150">③ B를 지난 순간</text>
  <text class="m" x="0" y="168" fill="#B3261E">t2 기록 — 소리 발사</text>
 </g>
</g>

<!-- 수식 -->
<g transform="translate(40,258)">
 <rect x="0" y="0" width="900" height="66" fill="#1F5FD814" stroke="#1F5FD8" stroke-width="0" />
 <rect x="0" y="0" width="3" height="66" fill="#1F5FD8"/>
 <text class="m" x="20" y="28" font-size="15">dt = t2 − t1</text>
 <text class="t" x="150" y="28">dt가 짧다 = 빨리 눌렀다 = 세게</text>
 <text class="s" x="20" y="50">빠르게 4 ms · 보통 26 ms · 아주 여리게 260 ms — 이 값을 0~127로 바꿔 MIDI로 보내면 끝이다</text>
</g>

<!-- IR 센서 -->
<g transform="translate(40,352)">
 <text class="b" x="0" y="0">A와 B는 IR 센서 하나로 읽는다</text>
 <g transform="translate(0,20)">
  <rect class="bed" x="70" y="26" width="16" height="56" rx="2"/>
  <rect class="bed" x="136" y="26" width="16" height="56" rx="2"/>
  <text class="s" x="62" y="98">IR LED</text><text class="s" x="132" y="98">수광부</text>
  <line class="beam" x1="88" y1="54" x2="134" y2="54"/>
  <rect x="104" y="8" width="14" height="92" fill="#2B2B2B"/>
  <rect x="102" y="40" width="18" height="26" fill="#EFECE6"/>
  <text class="s" x="126" y="18">↑ 건반에 붙은 검은 날개</text>
  <text class="s" x="126" y="34">가운데에 창이 뚫려 있다</text>
  <text class="t" x="200" y="46">창의 아래 모서리가 빛을 지나가면 = A</text>
  <text class="t" x="200" y="68">창의 위 모서리가 빛을 지나가면 = B</text>
  <text class="s" x="200" y="88">센서 1개, 부품 1개. 두 지점을 얻는다.</text>
 </g>
</g>

<!-- 페달 -->
<g transform="translate(560,352)">
 <text class="b" x="0" y="0">페달 — 그냥 스위치다</text>
 <g transform="translate(0,26)">
  <rect class="bed" x="0" y="14" width="96" height="14" rx="4"/>
  <circle cx="110" cy="21" r="4" fill="#8A8377"/>
  <line x1="114" y1="21" x2="168" y2="21" stroke="#8A8377" stroke-width="2"/>
  <rect x="168" y="8" width="70" height="26" rx="3" fill="#1F5FD8"/>
  <text class="m" x="203" y="25" text-anchor="middle" fill="#fff" font-size="11">Pico</text>
  <text class="s" x="0" y="52">밟았다 / 안 밟았다 둘뿐</text>
  <text class="m" x="168" y="58" fill="#2E7D4F">밟음 → CC64 = 127</text>
  <text class="m" x="168" y="76" fill="#2E7D4F">뗌 &nbsp;&nbsp;→ CC64 = 0</text>
 </g>
</g>
</svg>
