<text class="t h nb" x="40.490" y="106.536" font-size="2.90" text-anchor="middle">가운데 유닛 아랫판</text>
<text class="t h nb" x="31.000" y="76.468" font-size="2.90" text-anchor="middle">XT60 수</text>
<text class="t tb" x="3.000" y="143.200" font-size="3.30" text-anchor="start">② 옆 단면 x = 940.85 (왼쪽에서 봄, 연주자 쪽 = 왼쪽)</text>
<text class="t h td" x="67.000" y="246.400" font-size="2.90" text-anchor="middle">y 290</text>
