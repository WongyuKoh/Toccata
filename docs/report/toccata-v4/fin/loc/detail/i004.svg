<text class="t" x="3.000" y="246.200" font-size="2.90" text-anchor="start">대표 자리 중심 (x 603.57, y 67, z 12.9) · 바깥 크기 4 × 3 × 1.5 (x·y·z, 입체 상자)</text>
<text class="t" x="3.000" y="250.318" font-size="2.90" text-anchor="start">모듈 O4: x = 47 + 164.5(k-1) + 63.07 (k = 1·2·3·4·5·6·7, 모듈마다 같은 자리 12곳)</text>
<text class="t" x="3.000" y="254.436" font-size="2.90" text-anchor="start">모델에 없는 부품: 자석 O4-MAGNET-E 중심 x603.57 바로 밑 · body.SENSOR_YZ = (y67, z12.9)</text>
<text class="t" x="3.000" y="258.554" font-size="2.90" text-anchor="start">· 몸통 4 × 3 × 1.5 = TO-92(LPG) 표준 크기</text>
<text class="t" x="3.000" y="262.672" font-size="2.90" text-anchor="start">빨간 면 = 이 물건 (진한 = 대표, 연한 = 같은 물건의 다른 자리) · 빨간 점선 = 단면 밖 부분 · 주황 =</text>
<text class="t" x="3.000" y="266.790" font-size="2.90" text-anchor="start">붙는 자리 · 숫자는 mm, CAD 입체에서 계산</text>
