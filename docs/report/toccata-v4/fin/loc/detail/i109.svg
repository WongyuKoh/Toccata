<text class="t" x="3.000" y="210.089" font-size="2.90" text-anchor="start">대표 자리 중심 (x 678, y -280, z -687.5) · 바깥 크기 76 × 240 × 65 (x·y·z, 입체 상자)</text>
<text class="t" x="3.000" y="214.207" font-size="2.90" text-anchor="start">악기 밖(바닥)에 두는 부품이라 주변 부품 없이 그렸습니다.</text>
<text class="t" x="3.000" y="218.325" font-size="2.90" text-anchor="start">빨간 면 = 이 물건 (진한 = 대표, 연한 = 같은 물건의 다른 자리) · 빨간 점선 = 단면 밖 부분 · 주황 =</text>
<text class="t" x="3.000" y="222.443" font-size="2.90" text-anchor="start">붙는 자리 · 숫자는 mm, CAD 입체에서 계산</text>
