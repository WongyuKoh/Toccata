<text class="t h nb" x="88.603" y="109.148" font-size="2.90" text-anchor="middle">Apple USB-C → 3.5…</text>
<text class="t tb" x="3.000" y="134.496" font-size="3.30" text-anchor="start">② 옆 단면 x = 638.5 (왼쪽에서 봄, 연주자 쪽 = 왼쪽)</text>
