<text class="t" x="3.000" y="231.727" font-size="2.90" text-anchor="start">대표 자리 중심 (x 638.5, y 291, z 28.75) · 바깥 크기 18 × 16 × 6.5 (x·y·z, 입체 상자)</text>
<text class="t" x="3.000" y="235.845" font-size="2.90" text-anchor="start">빨간 면 = 이 물건 (진한 = 대표, 연한 = 같은 물건의 다른 자리) · 빨간 점선 = 단면 밖 부분 · 숫자는</text>
<text class="t" x="3.000" y="239.963" font-size="2.90" text-anchor="start">mm, CAD 입체에서 계산</text>
