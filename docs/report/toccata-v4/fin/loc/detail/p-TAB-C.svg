<text class="t" x="3.000" y="257.818" font-size="2.90" text-anchor="start">모듈 O4: x = 47 + 164.5(k-1) + 58.75 (k = 1·2·3·4·5·6·7, 모듈마다 같은 자리 7곳)</text>
