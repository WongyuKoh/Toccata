<text class="t" x="411.000" y="398.600" font-size="2.10" text-anchor="start">끝면(x 방향 면, 단면 33 × 48.92)을 베드에 세워 출력, 높이 250 - 브림 5 mm, 느린 속도(얇은 벽 6이 250 높이). 서포트 없음(단면 그대로 올라감). 옆판 사이에 끼워 앞벽 윗면·턱 위에 앞판을 MS 폴리머로,</text>
<text class="t" x="411.000" y="401.500" font-size="2.10" text-anchor="start">세움벽 밑은 아랫판 앞 모서리에 본드</text>
<text class="t tm" x="411.000" y="408.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
