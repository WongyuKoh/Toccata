<text class="t" x="364.000" y="260.500" font-size="2.40" text-anchor="start">2.3 g</text>
<text class="t tm" x="262.000" y="264.100" font-size="1.90" text-anchor="start">파일</text>
<text class="t" x="270.000" y="264.300" font-size="2.00" text-anchor="start">stl/print/03_프레임/프레임_가이드탭_백건__52개.stl</text>
<text class="t tm" x="270.000" y="267.800" font-size="1.80" text-anchor="start"></text>
<text class="t tm" x="262.000" y="272.300" font-size="1.90" text-anchor="start">출력·가공 메모</text>
<text class="t" x="262.000" y="275.600" font-size="2.10" text-anchor="start">옆면을 베드에 눕혀 출력 (서포트 없음, 키퍼 훅이 판 안에 있음). 키퍼 훅은 탭 폭 전체(설계 5.2 → 탭 폭)로 넓힘 - 키퍼 펠트 2T(5.2 폭)는 훅 밑 가운데에 붙임. 촉(깊이 5)은 앞</text>
<text class="t" x="262.000" y="278.500" font-size="2.10" text-anchor="start">1.0이 짧아 거꾸로 꽂히지 않음: 바닥틀 자리에 순간접착제를 한 방울 넣고 끝까지 꽂음 (A12; 옛 프레임의 탭 + 훅, 훅 밑 서포트가 없어짐). 부러지면 탭만 다시 뽑아 바꿈</text>
<text class="t tm" x="262.000" y="285.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
<text class="t tb" x="260.000" y="16.000" font-size="4.00" text-anchor="start">프레임 가이드탭 백건</text>
<text class="t" x="260.000" y="21.000" font-size="2.40" text-anchor="start">P-03-04 · 03 프레임</text>
<text class="t" x="260.000" y="24.360" font-size="2.40" text-anchor="start">크기 (도면 자세) 7.5 × 13.5 × 23.83</text>
<text class="t" x="260.000" y="27.720" font-size="2.40" text-anchor="start">출력 파일 크기 23.83 × 13.5 × 7.5 (STL 그대로)</text>
<text class="t tb" x="260.000" y="32.580" font-size="2.80" text-anchor="start">출력 자세</text>
<text class="t" x="277.000" y="71.780" font-size="1.95" text-anchor="middle">베드 256 × 256 (위에서)</text>
<text class="t" x="300.000" y="66.180" font-size="1.95" text-anchor="start">옆에서 (3.2:1) · 출력 높이 7.5</text>
<text class="t" x="260.000" y="75.580" font-size="2.15" text-anchor="start">베드에 닿는 면 = 도면의 왼쪽 면(-x)</text>
<text class="t" x="260.000" y="82.547" font-size="2.40" text-anchor="start">구멍·포켓: 없음 (x·y·z 모든 꼭짓점 평면 사이를 잘라 봄: 닫힌 안쪽 윤곽 없음)</text>
<text class="t tb" x="260.000" y="87.547" font-size="2.70" text-anchor="start">치수 메모</text>
<text class="t" x="260.000" y="91.221" font-size="2.30" text-anchor="start">· 월드 좌표 = 부품 기준 + (55, 11.5, 6.17) — 기준 개체 O1-TAB-C</text>
<text class="t" x="260.000" y="94.395" font-size="2.30" text-anchor="start">· 모서리 좌표 10개 전부 시트에 있음 (좌표 CSV · DXF에도 같음)</text>
