<text class="t" x="262.000" y="272.700" font-size="2.10" text-anchor="start">바깥면(+x)을 베드에, 립 3개(위 앞·위 뒤·아래)가 위. 서포트 없음, 층 0.1 mm 권장(판 0.7). 레버 캐리어의 +x 옆벽을 따로 뽑은 것 (A12): 강철을 넣은 칸 위에 덮어 강철 +x 면과</text>
<text class="t" x="262.000" y="275.600" font-size="2.10" text-anchor="start">MS 폴리머로 붙임 - 위 앞 립 앞끝이 캐리어 앞 뚜껑(y153)에, 위 뒤 립 뒤끝이 칸 뒷벽(y190)에 닿아 자리가 잡힘. 앞끝 0.8과 뒤끝은 캐리어 앞벽·뒷벽 옆면에 같이 붙음. 모든</text>
