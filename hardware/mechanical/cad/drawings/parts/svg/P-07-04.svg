<text class="t tm" x="262.000" y="275.200" font-size="1.90" text-anchor="start">출력·가공 메모</text>
<text class="t" x="262.000" y="278.500" font-size="2.10" text-anchor="start">유리가 얹히는 면(u0)을 베드에 눕혀 출력(높이 2.5). 서포트 없음. 약 4 g</text>
<text class="t tm" x="262.000" y="285.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
<text class="t tb" x="260.000" y="16.000" font-size="4.00" text-anchor="start">화면받침 유리턱띠 왼쪽</text>
