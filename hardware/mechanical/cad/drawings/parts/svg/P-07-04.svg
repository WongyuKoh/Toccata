<text class="t" x="260.000" y="24.360" font-size="2.40" text-anchor="start">크기 (도면 자세) 131.3 × 8.95 × 2.5</text>
<text class="t" x="260.000" y="27.720" font-size="2.40" text-anchor="start">출력 파일 크기 131.3 × 8.95 × 2.5 (STL 그대로)</text>
<text class="t tb" x="260.000" y="32.580" font-size="2.80" text-anchor="start">출력 자세</text>
<text class="t" x="277.000" y="71.780" font-size="1.95" text-anchor="middle">베드 256 × 256 (위에서)</text>
<text class="t" x="300.000" y="66.180" font-size="1.95" text-anchor="start">옆에서 (1:1.2) · 출력 높이 2.5</text>
<text class="t" x="260.000" y="75.580" font-size="2.15" text-anchor="start">베드에 닿는 면 = 도면의 윗면(+z) (뒤집어 출력)</text>
<text class="t" x="260.000" y="82.547" font-size="2.40" text-anchor="start">구멍·포켓: 없음 (x·y·z 모든 꼭짓점 평면 사이를 잘라 봄: 닫힌 안쪽 윤곽 없음)</text>
<text class="t tb" x="260.000" y="87.547" font-size="2.70" text-anchor="start">치수 메모</text>
<text class="t" x="260.000" y="91.221" font-size="2.30" text-anchor="start">· 조립에서는 도면 자세를 -x축 둘레로 25° 돌린 자세 (기준 개체 TS-LEDGE-L). 그림은 기울기를 뺀 바른 자세, 표의 월드 좌표는 실제(기울어진) 자리</text>
<text class="t" x="260.000" y="94.395" font-size="2.30" text-anchor="start">· 모서리 좌표 6개 전부 시트에 있음 (좌표 CSV · DXF에도 같음)</text>
<text class="t" x="260.000" y="97.569" font-size="2.30" text-anchor="start">· A-A 단면 벽 두께: 2.5</text>
