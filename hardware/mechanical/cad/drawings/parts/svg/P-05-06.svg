<text class="t tm" x="411.000" y="395.300" font-size="1.90" text-anchor="start">출력·가공 메모</text>
<text class="t" x="411.000" y="398.600" font-size="2.10" text-anchor="start">바깥면(옆면)을 베드에 놓고 출력. 서포트 없음. **밀폐 상자 벽: 벽 5줄 이상 + 윗·아랫면 5층 + 채움 40 % 이상** (두드려 통통 울리면 채움 60~100 %로 다시), PETG 0.2 mm. 넓은 판이라 모서리가 뜨기</text>
<text class="t" x="411.000" y="401.500" font-size="2.10" text-anchor="start">쉬움 - 문 닫고 베드 70~80 °C, 다 식은 뒤 떼어 냄, 뜨면 브림 3 mm. 상자 이음은 모두 MS 폴리머 (PETG에는 목공본드가 잘 붙지 않음). 약 117 g · 약 2시간 56분 (P2S 어림, 슬라이서 값이 기준)</text>
<text class="t tm" x="411.000" y="408.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
