<text class="t h tm" x="20.000" y="188.500" font-size="1.95" text-anchor="start">그림 왼쪽 아래 = x 0 · z 0 (부품 기준)</text>
<text class="t tg" x="51.979" y="124.700" font-size="2.15" text-anchor="start">초록 굵은 선 = 기준 모서리 (u·v를 재는 곳) · ⊕ = 나사 자리 (점선 = 반대 면)</text>
<text class="t tb" x="411.500" y="362.000" font-size="4.60" text-anchor="start">Toccata 부품도</text>
<text class="t tb" x="581.500" y="362.400" font-size="5.40" text-anchor="end">P-PLY-07</text>
<text class="t tb" x="411.500" y="371.000" font-size="3.60" text-anchor="start">스피커 L 아랫판</text>
<text class="t tm" x="411.000" y="376.000" font-size="1.90" text-anchor="start">척도</text>
<text class="t" x="411.000" y="379.400" font-size="2.40" text-anchor="start">1:1</text>
<text class="t tm" x="454.750" y="376.000" font-size="1.90" text-anchor="start">단위</text>
<text class="t" x="454.750" y="379.400" font-size="2.40" text-anchor="start">mm</text>
<text class="t tm" x="498.500" y="376.000" font-size="1.90" text-anchor="start">용지</text>
<text class="t" x="498.500" y="379.400" font-size="2.40" text-anchor="start">A2</text>
<text class="t tm" x="542.250" y="376.000" font-size="1.90" text-anchor="start">날짜</text>
<text class="t" x="542.250" y="379.400" font-size="2.40" text-anchor="start">2026-10-08</text>
<text class="t tm" x="411.000" y="383.000" font-size="1.90" text-anchor="start">수량 (악기 1대)</text>
<text class="t" x="411.000" y="386.400" font-size="2.40" text-anchor="start">1장</text>
<text class="t tm" x="460.000" y="383.000" font-size="1.90" text-anchor="start">재료·색</text>
<text class="t" x="460.000" y="386.400" font-size="2.40" text-anchor="start">오꾸메 합판 11.5T</text>
<text class="t tm" x="530.000" y="383.000" font-size="1.90" text-anchor="start">부피</text>
<text class="t" x="530.000" y="386.400" font-size="2.40" text-anchor="start">부피 258.8 cm³</text>
<text class="t tm" x="411.000" y="390.000" font-size="1.90" text-anchor="start">파일</text>
<text class="t" x="419.000" y="390.200" font-size="2.00" text-anchor="start">합판 조각 (출력 파일 없음) · CAD SPKL-PLY-BOTTOM</text>
<text class="t tm" x="419.000" y="393.700" font-size="1.80" text-anchor="start"></text>
<text class="t tm" x="411.000" y="398.200" font-size="1.90" text-anchor="start">가공 메모</text>
<text class="t" x="411.000" y="401.500" font-size="2.10" text-anchor="start">가게: 직사각형 250 × 90 (두께 11.5)으로만 자름. 경사·따냄은 톱, 구멍은 지그 (cad/jigs/README.md). 자르자마자 조각 이름·L 끝·&#x27;윗면&#x27;를 연필로 씀</text>
<text class="t tm" x="411.000" y="408.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
<text class="t tb" x="409.000" y="16.000" font-size="4.00" text-anchor="start">스피커 L 아랫판</text>
<text class="t" x="409.000" y="21.000" font-size="2.40" text-anchor="start">P-PLY-07 · 합판 (재단)</text>
<text class="t" x="409.000" y="24.360" font-size="2.40" text-anchor="start">크기 (도면 자세) 250 × 90 × 11.5</text>
<text class="t" x="409.000" y="27.720" font-size="2.40" text-anchor="start">재단 직사각형 250 × 90, 두께 11.5</text>
<text class="t" x="409.000" y="32.580" font-size="2.15" text-anchor="start">합판: 평면도 = &#x27;윗면&#x27;이 위인 면 (D06와 같음). 가게에서 직사각형 250 × 90로 자르고, 나머지는 집에서</text>
<text class="t" x="409.000" y="38.547" font-size="2.40" text-anchor="start">구멍·포켓: 없음 (x·y·z 모든 꼭짓점 평면 사이를 잘라 봄: 닫힌 안쪽 윤곽 없음)</text>
<text class="t tb" x="409.000" y="43.547" font-size="2.70" text-anchor="start">치수 메모</text>
<text class="t" x="409.000" y="47.221" font-size="2.30" text-anchor="start">· 판 좌표 u·v = 평면도의 x·y (원점 = 초록 기준 모서리의 만나는 점 = 입체 (-4.5, 241) x·y 면)</text>
<text class="t" x="409.000" y="50.395" font-size="2.30" text-anchor="start">· 이 면이 위: 윗면 · 반대 면: 밑면 · 두께 11.5</text>
<text class="t" x="409.000" y="53.569" font-size="2.30" text-anchor="start">· 모서리 좌표 6개 전부 시트에 있음 (좌표 CSV · DXF에도 같음)</text>
<text class="t" x="409.000" y="56.743" font-size="2.30" text-anchor="start">· A-A 단면 벽 두께: 11.5</text>
<text class="t" x="409.000" y="59.917" font-size="2.30" text-anchor="start">· 나사 자리 ⊕ 고무발 8호 13 ×4 (밑면에서 박음, 송곳): (10.5, 21) · (10.5, 79) · (235.5, 21) · (235.5, 79)</text>
<text class="t" x="409.000" y="63.091" font-size="2.30" text-anchor="start">· DXF: CUT = 바깥 윤곽 + 관통 구멍 (원), DRILL_BLIND = 막힘 구멍 (깊이 글자), MARK = 나사 자리, 나머지 = 세 방향 그림 (1:1, mm)</text>
</g>
