<text class="t tm" x="419.000" y="390.800" font-size="1.80" text-anchor="start"></text>
<text class="t tm" x="411.000" y="395.300" font-size="1.90" text-anchor="start">출력·가공 메모</text>
<text class="t" x="411.000" y="398.600" font-size="2.10" text-anchor="start">바깥면(뒷면)을 베드에 놓고 출력. 서포트 없음. **밀폐 상자 벽: 벽 5줄 이상 + 윗·아랫면 5층 + 채움 40 % 이상** (두드려 통통 울리면 채움 60~100 %로 다시), PETG 0.2 mm. 넓은 판이라 모서리가 뜨기</text>
<text class="t" x="411.000" y="401.500" font-size="2.10" text-anchor="start">쉬움 - 문 닫고 베드 70~80 °C, 다 식은 뒤 떼어 냄, 뜨면 브림 3 mm. 상자 이음은 모두 MS 폴리머 (PETG에는 목공본드가 잘 붙지 않음). 약 300 g · 약 7시간 23분 (P2S 어림, 슬라이서 값이 기준)</text>
<text class="t tm" x="411.000" y="408.200" font-size="1.90" text-anchor="start">모든 선과 숫자는 출력 파일의 입체에서 잼 (src/part_sheets.py) · 3각법</text>
<text class="t tb" x="409.000" y="16.000" font-size="4.00" text-anchor="start">스피커뒤판 L·R</text>
<text class="t" x="409.000" y="21.000" font-size="2.40" text-anchor="start">P-05-03 · 05 본체 출력물</text>
<text class="t" x="409.000" y="24.360" font-size="2.40" text-anchor="start">크기 (도면 자세) 250 × 11.5 × 139.65</text>
<text class="t" x="409.000" y="27.720" font-size="2.40" text-anchor="start">출력 파일 크기 250 × 139.65 × 11.5 (STL 그대로)</text>
<text class="t tb" x="409.000" y="32.580" font-size="2.80" text-anchor="start">출력 자세</text>
<text class="t" x="426.000" y="71.780" font-size="1.95" text-anchor="middle">베드 256 × 256 (위에서)</text>
<text class="t" x="449.000" y="66.180" font-size="1.95" text-anchor="start">옆에서 (1:1.9) · 출력 높이 11.5</text>
<text class="t" x="409.000" y="75.580" font-size="2.15" text-anchor="start">베드에 닿는 면 = 도면의 뒷면(+y)</text>
<text class="t" x="409.000" y="82.547" font-size="2.40" text-anchor="start">구멍·포켓: 없음 (x·y·z 모든 꼭짓점 평면 사이를 잘라 봄: 닫힌 안쪽 윤곽 없음)</text>
<text class="t tb" x="409.000" y="87.547" font-size="2.70" text-anchor="start">치수 메모</text>
<text class="t" x="409.000" y="91.221" font-size="2.30" text-anchor="start">· 월드 좌표 = 부품 기준 + (-4.5, 331, 5) — 기준 개체 SPKL-PLY-BACK</text>
<text class="t" x="409.000" y="94.395" font-size="2.30" text-anchor="start">· 모서리 좌표 6개 전부 시트에 있음 (좌표 CSV · DXF에도 같음)</text>
